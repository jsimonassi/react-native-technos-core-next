# Configurações do Gradle para o projeto todo. O Android Studio pode sobrescrever estas opções pela IDE.

# Memória do daemon do Gradle; o build com codegen e CMake do RN não cabe no padrão de 512 MB.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Builds paralelos ficam desligados, como no modelo do RN.
# org.gradle.parallel=true

android.useAndroidX=true

# Arquiteturas nativas compiladas; pode ser trocado na linha de comando com -PreactNativeArchitectures=x86_64.
# Só arm64: a PoC roda em aparelho físico e o build fica bem mais rápido.
reactNativeArchitectures=arm64-v8a

# Nova arquitetura (TurboModules e Fabric): obrigatória, a biblioteca é um TurboModule.
newArchEnabled=true

# Motor JS Hermes; com false o app usa o JSC.
hermesEnabled=true

# Desenho por trás das barras do sistema (edge-to-edge) desligado, como no modelo do RN.
edgeToEdgeEnabled=false
