buildscript {
	ext {
		buildToolsVersion = "36.0.0"
		minSdkVersion = 26
		compileSdkVersion = 36
		targetSdkVersion = 36
		ndkVersion = "27.1.12297006"
		kotlinVersion = "2.1.20"
	}
	repositories {
		google()
		mavenCentral()
	}
	dependencies {
		classpath("com.android.tools.build:gradle")
		classpath("com.facebook.react:react-native-gradle-plugin")
		classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
	}
}

apply plugin: "com.facebook.react.rootproject"

// O módulo de protocolo (technos-watch-protocol) só existe no mavenLocal nesta PoC (publishToMavenLocal).
// Precisa estar aqui, e não só no android/build.gradle da biblioteca, porque o app resolve as dependências
// transitivas da biblioteca com os próprios repositórios. Restrito ao grupo para não mascarar outras dependências.
allprojects {
	repositories {
		mavenLocal {
			content {
				includeGroup("br.com.grupotechnos.watch")
			}
		}
	}
}
